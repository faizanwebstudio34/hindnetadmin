del:async d=>{const c=COL[st.view],x=cur(d.id);if(!await ask(`Delete "${x.name||x.title||x.caption||x.from||"this item"}" permanently?`))return;try{await deleteDoc(doc(db,c,x.id));if(prod(c))try{await deleteDoc(doc(db,"media",x.id))}catch{}st.DB[c]=st.DB[c].filter(y=>y.id!=x.id);toast("Deleted");draw(true)}catch(err){toast(errMsg(err),"err")}},
cover:d=>{const[s]=st.ph.splice(+d.i,1);st.ph.unshift(s);phr()},rmph:d=>{st.ph.splice(+d.i,1);phr()},
scan:async()=>{const s=$("#ss"),f=$("#sc").files[0];try{let t=$("#stx").value;if(f){s.textContent="Reading photo...";t=await ocr(f);$("#stx").value=t}const r=parse(t),el=$("#fm").elements;for(const k in r)if(r[k]&&el[k])el[k].value=r[k];s.textContent="Done. Please review the fields."}catch{s.textContent="Scan failed. Paste the text instead."}},
testwa:()=>{const n=$("#s-wa").value.replace(/\D/g,"");n?window.open("https://wa.me/"+n,"_blank"):toast("Enter a WhatsApp number first","err")},
csv:()=>{const v=st.view,D=st.DB[COL[v]]||[];const M={laptops:[["Name","Brand","Price","MRP","Stock","Specs","Visible"],x=>[x.name,x.brand,x.price,x.mrp,x.stock,x.specs,x.hidden?"No":"Yes"]],requests:[["Type","From","To","Date","Class","Passengers","Email","Status","Created"],x=>[x.type,x.from,x.to,x.date,x.cls,x.pax,x.email,bs(x),new Date(x.at).toISOString()]],messages:[["Name","Email","Message","Read","Created"],x=>[x.name,x.email,x.message,x.read?"Yes":"No",new Date(x.at).toISOString()]]};M.accessories=M.laptops;csv("hindnet-"+v,[M[v][0],...D.map(M[v][1])])}};
const C={st:(d,el)=>upd(d.id,{status:el.value},()=>{el.className="sel "+el.value;nav()})};
document.addEventListener("click",ev=>{const b=ev.target.closest("[data-a]");if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset,b)});
document.addEventListener("change",async ev=>{const t=ev.target;if(t.dataset.ch)C[t.dataset.ch](t.dataset,t);else if(t.id=="so"){st.sort=t.value;$("#lst").innerHTML=ROWS[st.view]()}else if(t.id=="pi"){try{for(const f of[...t.files].slice(0,mx()-st.ph.length))st.ph.push(await rs(f));phr()}catch(x){toast(errMsg(x),"err")}}else if(t.id=="sc"&&t.files[0])A.scan()});
document.addEventListener("input",ev=>{if(ev.target.id=="q"){st.q=ev.target.value.toLowerCase();$("#lst").innerHTML=ROWS[st.view]()}});
document.addEventListener("submit",async ev=>{const f=ev.target;if(f.id=="fm")return saveForm(ev);ev.preventDefault();
if(f.id=="lg"){const b=$("#lb");$("#le").textContent="";b.disabled=true;try{await signInWithEmailAndPassword(auth,f.e.value.trim(),f.p.value)}catch(x){$("#le").textContent=x.code=="auth/network-request-failed"?"Network error. Check your internet.":x.code=="auth/too-many-requests"?"Too many attempts. Try again later.":"Wrong email or password."}b.disabled=false}
if(f.id=="sf"){const d={};SF.forEach(([k])=>d[k]=f.elements[k].value.trim());d.wa=d.wa.replace(/\D/g,"");const b=f.querySelector(".p");b.disabled=true;try{await setDoc(doc(db,"settings","site"),d,{merge:true});toast("Contact info saved")}catch(x){toast(errMsg(x),"err")}b.disabled=false}});
addEventListener("keydown",ev=>{if(ev.key=="Escape"){closeSh();closeOv()}});
onAuthStateChanged(auth,u=>{const ok=u&&u.email===ADMIN;if(u&&!ok){signOut(auth);$("#le").textContent="This is not the admin account."}$("#splash").hidden=true;$("#login").hidden=!!ok;$("#shell").hidden=!ok;$("#bn").hidden=!ok;if(ok){draw();Promise.all([load("bookings"),load("messages")]).then(nav).catch(()=>{})}else{st.DB={};closeSh();closeOv()}});
</script></body></html>
