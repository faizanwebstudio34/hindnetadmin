<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Hindnet Control Room</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050507;--card:#111114;--ink:#f5f5f7;--mut:#86868b;--ac:#2997ff;--ln:#ffffff1a}@media(prefers-color-scheme:light){:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--mut:#6e6e73;--ac:#0071e3;--ln:#0000001a}}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;padding:clamp(14px,3vw,32px);max-width:1280px;margin:auto}
h1,h2,h3{letter-spacing:-.03em}h2{margin:26px 0 14px}header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:22px}.lg{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;margin-right:auto}.lg:before{content:"H";display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--ac);color:#fff}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:22px;scrollbar-width:none}button,input,textarea,select{font:inherit;color:inherit}
button{min-height:44px;padding:10px 18px;border-radius:99px;border:1px solid var(--ln);background:none;cursor:pointer;white-space:nowrap;transition:.2s}button:hover{border-color:var(--ac)}button.on,button.p{background:var(--ac);border-color:var(--ac);color:#fff}button.d{color:#ff453a}
.box{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:22px;margin-bottom:22px}.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}.fg .w{grid-column:1/-1}
input,textarea,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--bg)}textarea{min-height:90px;resize:vertical}label{font-size:12px;color:var(--mut);display:block;margin-bottom:4px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px}.c{background:var(--card);border:1px solid var(--ln);border-radius:16px;overflow:hidden}.c img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}.c>div{padding:14px}.c p{color:var(--mut);font-size:13px;margin:4px 0 10px}.c .bt{display:flex;gap:8px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}.kp div{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:18px}.kp b{font-size:34px;display:block}.kp span{color:var(--mut)}
.pv{display:flex;gap:10px;flex-wrap:wrap}.pv img{width:90px;height:90px;object-fit:cover;border-radius:12px;border:1px solid var(--ln);cursor:pointer}.sc{border:1px dashed var(--ac);border-radius:16px;padding:16px;margin-bottom:16px}.m{color:var(--mut);font-size:13px}
</style></head><body><div id="a"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,getDocs,addDoc,updateDoc,deleteDoc,doc,query,orderBy}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const FB={apiKey:"AIzaSyAcKFw1IKx9BAcQUfX4Vg75Pr8vzCfTH1s",authDomain:"hindnetweb.firebaseapp.com",projectId:"hindnetweb",storageBucket:"hindnetweb.firebasestorage.app",messagingSenderId:"1038020453028",appId:"1:1038020453028:web:5234108e453a1f015cfc31"},ADMIN="hindnet@web.com";
const fb=initializeApp(FB),auth=getAuth(fb),db=getFirestore(fb),$=s=>document.querySelector(s);
const e=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const PF=[["name","Product name"],["brand","Brand"],["price","Selling price (INR)"],["mrp","MRP (INR)"],["stock","Stock quantity"],["specs","Key specs: i7 | 16GB | 512GB SSD"],["highlights","Highlights (one per line)","t"],["desc","Description","t"],["table","Spec table (Key: Value, one per line)","t"]];
const FD={laptops:PF,accessories:PF,gallery:[["caption","Caption"]],offers:[["title","Offer title"],["desc","Description","t"],["code","Promo code"],["tag","Tag, e.g. Limited time"]],reviews:[],messages:[],bookings:[]};
const T={overview:"Overview",laptops:"Laptops",accessories:"Accessories",gallery:"Gallery",offers:"Offers",reviews:"Reviews",messages:"Messages",bookings:"Travel Requests"};
let tab="overview",U=null,eid=null,keep=[],L=[];
const list=async c=>{try{return(await getDocs(query(collection(db,c),orderBy("at","desc")))).docs.map(d=>({id:d.id,...d.data()}))}catch(_){return[]}};
const rs=f=>new Promise(r=>{const i=new Image;i.onload=()=>{const k=Math.min(1,1000/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.76))};i.src=URL.createObjectURL(f)});
async function ocr(f){if(!window.Tesseract)await new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js";s.onload=ok;s.onerror=no;document.head.append(s)});return(await Tesseract.recognize(f,"eng")).data.text}
function parse(t){const g=r=>(t.match(r)||[])[1],br=["Apple","Dell","HP","Lenovo","Asus","Acer","MSI","Samsung","Logitech","Sony","Anker","Razer","Microsoft"].find(b=>new RegExp("\\b"+b+"\\b","i").test(t));
const cpu=g(/(Core\s*(?:Ultra\s*)?[i]?[3579][-\s]?\w{0,6}|Ryzen\s*[3579]\s*\w{0,6}|Apple\s*M[1-4](?:\s*(?:Pro|Max))?|Snapdragon\s*X\s*\w+)/i),ram=g(/(\d{1,2})\s*GB\s*(?:DDR|LPDDR|RAM|Unified)/i)||g(/RAM[:\s]*(\d{1,2})\s*GB/i),st=t.match(/(\d{3,4}\s*GB|\d\s*TB)\s*(SSD|HDD|NVMe)/i),dp=g(/(\d{2}(?:\.\d)?)\s*(?:inch|"|”)/i),pr=g(/(?:₹|Rs\.?|INR)\s*([\d,]{4,9})/i),gpu=g(/(RTX\s*\d{4}|GTX\s*\d{4}|Radeon\s*\w+\s*\d*)/i),nm=t.split("\n").map(x=>x.trim()).find(x=>x.length>5&&(!br||new RegExp(br,"i").test(x)));
const rows=[["Processor",cpu],["Memory",ram&&ram+" GB"],["Storage",st&&st[1]+" "+st[2]],["Display",dp&&dp+" inch"],["Graphics",gpu]].filter(r=>r[1]);
return{name:nm||"",brand:br||"",price:pr?pr.replace(/,/g,""):"",specs:[cpu,ram&&ram+"GB RAM",st&&st[1]+" "+st[2],dp&&dp+"\" display"].filter(Boolean).join(" | "),table:rows.map(r=>r.join(": ")).join("\n")}}
const fill=d=>{const f=$("#pf").elements;for(const k in d)if(d[k]&&f[k])f[k].value=d[k]};
async function show(){const A=$("#a");
if(!U){A.innerHTML=`<form class="box" onsubmit="lg(event)" style="max-width:400px;margin:12vh auto"><h2 style="margin-top:0">Hindnet Control Room</h2><div class="fg" style="grid-template-columns:1fr"><input name="e" type="email" placeholder="Admin email" required><input name="p" type="password" placeholder="Password" required><button class="p">Sign in</button></div></form>`;return}
const hd=`<header><div class="lg">Control Room</div><button onclick="out()">Sign out</button></header><div class="tabs">${Object.keys(T).map(k=>`<button class="${k==tab?"on":""}" onclick="go('${k}')">${T[k]}</button>`).join("")}</div>`;
if(tab=="overview"){const n=await Promise.all(Object.keys(FD).map(async k=>[k,(await list(k)).length]));A.innerHTML=hd+`<div class="kp">${n.map(([k,v])=>`<div><b>${v}</b><span>${T[k]}</span></div>`).join("")}</div>`;return}
L=await list(tab);const fd=FD[tab],pr=fd===PF,img=pr||tab=="gallery";
A.innerHTML=hd+(fd.length?`<form class="box" id="pf" onsubmit="sv(event)"><h3 style="margin-bottom:14px">${eid?"Edit item":"Add to "+T[tab]}</h3>${pr?`<div class="sc"><b>Scan to fill</b><p class="m" style="margin:4px 0 10px">Take or upload a photo of the spec sticker, box or listing. Details are read automatically. Or paste spec text below.</p><div class="fg"><input type="file" id="sf" accept="image/*" capture="environment"><textarea id="st" placeholder="Paste spec text here"></textarea></div><p style="margin-top:10px"><button type="button" onclick="scan()">Scan / parse</button> <span class="m" id="ss"></span></p></div>`:""}<div class="fg">${fd.map(([k,l,t])=>`<div class="${t?"w":""}"><label>${l}</label>${t?`<textarea name="${k}"></textarea>`:`<input name="${k}">`}</div>`).join("")}</div>${img?`<div style="margin-top:14px"><label>Photos (up to ${pr?3:1}). Click a saved photo to remove it.</label><input type="file" name="files" accept="image/*" multiple><div class="pv" id="pv" style="margin-top:10px">${keep.map((s,i)=>`<img src="${e(s)}" onclick="rm(${i})" alt="">`).join("")}</div></div>`:""}<p style="margin-top:16px"><button class="p">${eid?"Save changes":"Add item"}</button> ${eid?'<button type="button" onclick="cx()">Cancel</button>':""}</p></form>`:"")+`<div class="g">${L.map(x=>`<div class="c">${(x.images?.[0]||x.img)?`<img src="${e(x.images?.[0]||x.img)}" alt="">`:""}<div><b>${e(x.name||x.title||x.caption||x.type+": "+x.from+" to "+x.to)}</b><p>${e([x.brand,x.price&&"INR "+x.price,x.stock!=null&&x.stock!==""?"Stock "+x.stock:"",x.code,x.rating&&x.rating+" stars",x.date,x.pax&&x.pax+" passengers",x.email].filter(Boolean).join(" | "))} ${e(x.text||x.message||"")}</p><div class="bt">${fd.length?`<button onclick="ed('${x.id}')">Edit</button>`:""}<button class="d" onclick="del('${x.id}')">Delete</button></div></div></div>`).join("")||'<p class="m">Nothing here yet.</p>'}</div>`}
Object.assign(window,{go:k=>{tab=k;eid=null;keep=[];show()},out:()=>signOut(auth),rm:i=>{keep.splice(i,1);$("#pv").innerHTML=keep.map((s,j)=>`<img src="${e(s)}" onclick="rm(${j})" alt="">`).join("")},cx:()=>{eid=null;keep=[];show()},
lg:async ev=>{ev.preventDefault();const f=ev.target.elements;try{await signInWithEmailAndPassword(auth,f.e.value,f.p.value)}catch(x){alert("Sign-in failed. Check your email and password.")}},
scan:async()=>{const s=$("#ss"),f=$("#sf").files[0];try{let t=$("#st").value;if(f){s.textContent="Reading image...";t=await ocr(f);$("#st").value=t}fill(parse(t));s.textContent="Done. Please review the fields."}catch{s.textContent="Scan failed. Paste the text instead."}},
ed:id=>{const x=L.find(y=>y.id==id);eid=id;keep=[...(x.images||(x.img?[x.img]:[]))];show().then(()=>{const f=$("#pf").elements;FD[tab].forEach(([k])=>f[k].value=x[k]??"");scrollTo(0,0)})},
sv:async ev=>{ev.preventDefault();const f=ev.target.elements,d={},pr=FD[tab]===PF;FD[tab].forEach(([k])=>d[k]=f[k].value);["price","mrp","stock"].forEach(k=>{if(k in d&&d[k]!=="")d[k]=+d[k]});
if(pr||tab=="gallery"){let im=[...keep];for(const fl of[...f.files.files])if(im.length<(pr?3:1))im.push(await rs(fl));if(!im.length)return alert("Add at least one photo.");d.images=im;d.img=im[0]}
ev.target.querySelector("button.p").disabled=true;try{eid?await updateDoc(doc(db,tab,eid),d):await addDoc(collection(db,tab),{...d,at:Date.now()})}catch(x){alert("Save failed: "+x.code)}eid=null;keep=[];show()},
del:async id=>{if(confirm("Delete permanently?")){await deleteDoc(doc(db,tab,id));show()}}});
onAuthStateChanged(auth,u=>{U=u&&u.email===ADMIN?u:null;if(u&&!U){signOut(auth);alert("This is not the admin account.")}show()});
</script></body></html>
